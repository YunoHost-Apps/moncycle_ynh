packaging_format = 2

id = "moncycle"
name = "Moncycle"
description.en = "Menstrual cycle follow-up for natural family planning"
description.fr = "Suivi de cycle pour les méthodes naturelles de régulation de naissance"

version = "14~ynh4"

maintainers = ["Raoul de Limezy"]

[upstream]
license = "CC-BY-NC-SA-4.0"
website = "https://moncycle.app"
demo = "https://tableau.moncycle.app/connexion.php?email1=demo.bill@moncycle.app&mdp=demo"
code = "https://github.com/moncycle-app/backend-api-web-app"

[antifeatures]
# This flag has been collectively discussed and agreed upon, it shall not be removed without collective review
arbitrary-limitations.en = "This app promotes and links to methods and conservative organizations, some of which received funding from a known far-right reactionary person. These methods' efficiencies have not been scientifically demonstrated. Be cautious when using it, be wary of the political agenda of the persons promoting them."
arbitrary-limitations.fr = "Cette app promeut et fait référence à des méthodes et des organisations conservatives, dont certaines ont reçu des financements d'une personne reconnue réactionnaire d'extrême droite. Les efficacités de ces méthodes n'ont pas été reconnues scientifiquement. Faites preuve de prudence en utilisant l'app, faites attention à l'agenda politique des personnes promouvant ces méthodes."

[integration]
yunohost = ">= 12.0.9"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "100M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"

[resources]
        [resources.sources.main]
        url = "https://github.com/moncycle-app/backend-api-web-app/archive/2c14d712156c803244c10d14b90206721e678818.zip"
        sha256 = "f4187ca4575e0d4ec8881239c5a4cc1168125f5ecc5bb9bac89f29d0c3ba1696"
        autoupdate.strategy = "latest_github_release"

    [resources.system_user]

    [resources.install_dir]
    group = "www-data:r-x"

    [resources.permissions]
    main.url = "/"

    [resources.apt]
    packages = "mariadb-server, php8.3-gd, php8.3-mysql, php8.3-xml, php8.3-mbstring, php8.3-opcache"

    [resources.database]
    type = "mysql"
